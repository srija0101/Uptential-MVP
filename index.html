            animation: {

                '0%': { opacity: '0', transform: 'translateY(10px)' },

          }

    <style>

      body {

        background-image: linear-gradient(to bottom, #020617, #000000, #1a0b2e);

        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ff0080; 
      }
      
      .perspective-1000 {
        perspective: 1000px;
      }
